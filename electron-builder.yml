appId: app.clipify.desktop
productName: Clipify
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
extraResources:
  - from: engine
    to: engine
  - from: resources
    to: resources
    filter: ["*.png"]
asarUnpack:
  - node_modules/ffmpeg-static/**
  - node_modules/ffprobe-static/**
  - node_modules/better-sqlite3/**
mac:
  target: [dmg]
  # ffprobe-static ships every platform's binary; keep only this build's
  files:
    - "!node_modules/ffprobe-static/bin/{linux,win32}/**"
    - "!node_modules/ffprobe-static/bin/darwin/x64/**"
    - "!node_modules/better-sqlite3/prebuilds/{linux,linuxmusl,win32}-*.node"
  category: public.app-category.video
  icon: resources/icon.png
win:
  target: [nsis]
  files:
    - "!node_modules/ffprobe-static/bin/{linux,darwin}/**"
    - "!node_modules/ffprobe-static/bin/win32/ia32/**"
    - "!node_modules/better-sqlite3/prebuilds/{linux,linuxmusl,darwin}-*.node"
  icon: resources/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
